<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#16101f; --ink:#f2eaff; --dim:#a898c8; --line:#2f2445; --accent:#8b5cf6; }
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 18px; background: var(--bg); color: var(--ink);
         font: 14px/1.45 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 16px; color: var(--dim); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
  .col { padding: 10px 0; border-top: 1px solid var(--line); }
  .col label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .col label span { color: var(--dim); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { width: 38px; height: 22px; accent-color: var(--accent); }
  button { width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: transparent; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  button:focus-visible, input:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 2px; }
  #msg { min-height: 18px; margin-top: 10px; color: #c4b5fd; font-size: 12.5px; }
  small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Snap Vanish</h1>
  <p class="sub">Snap on camera in Google Meet. You turn to dust and your mic mutes. Snap again to return.</p>

  <div class="row"><label for="enabled">Enabled</label><input type="checkbox" id="enabled"></div>

  <div class="col">
    <label for="sens">Snap sensitivity <span id="sensVal">50</span></label>
    <input type="range" id="sens" min="0" max="100" step="5">
    <small>Raise it if your snaps are missed. Lower it if talking triggers it.</small>
  </div>

  <div class="col">
    <button class="primary" id="plate">Capture empty room</button>
    <button id="test">Test snap</button>
    <button id="clear">Forget saved room</button>
    <small>Capture the room with you out of frame so only you turns to dust. Reload Meet after turning Enabled on or off.</small>
    <div id="msg" role="status"></div>
  </div>

<script src="popup.js"></script>
</body>
</html>
